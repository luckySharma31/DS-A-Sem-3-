<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <div class="quiz-container">

        <h1>Online Quiz for Assignment 1</h1>
        <p class="subtitle">Student Quiz Form</p>

        <!-- Student Details -->
        <div id="studentDetails">

            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter your Name">

            <label>Roll No.:</label>
            <input type="text" id="roll" placeholder="Enter your Roll Number">

            <label>Course:</label>
            <select id="course">
                <option value="">Select Course</option>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="B.Tech IT">B.Tech IT</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
            </select>

            <p><b>Select Section:</b></p>

            <label class="section">
                <input type="radio" name="section" value="A">
                Section A
            </label>

            <label class="section">
                <input type="radio" name="section" value="B">
                Section B
            </label>

            <label class="section">
                <input type="radio" name="section" value="C">
                Section C
            </label>

            <br>

            <button onclick="startQuiz()">Start Quiz</button>

        </div>


        <!-- Quiz Section -->
        <div id="quizSection">

            <div id="questionBox"></div>

            <button onclick="submitAnswer()">Submit Answer</button>

        </div>


        <!-- Result -->
        <div id="result"></div>

    </div>

    <script src="quiz.js"></script>

</body>
</html>
